[project]
name = "itau_purchase_propensity"
version = "0.1.0"
description = "Technical case for Itaú"
readme = "README.md"
authors = [
    { name = "Gabriel Frigo", email = "gfrigo.sena@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
itau_purchase_propensity = "itau_purchase_propensity:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
